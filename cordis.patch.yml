# @arcaneorion/dsh-tui —— 终端前门 bundle 补丁
#
# 铁在 dsh-base 之上。内核（llm / session / agent / 沙箱 / 审批 / 命令 / 存储 /
# 会话持久化）仍来自 dsh-base；本 bundle 提供「表面」+「agent 能力面」：
# 终端渲染、输入、事件投影，以及会话预设（agent presets）。
#
# 补丁语义提醒：带 id 的覆盖会**整体替换**目标行的 config，不是深合并，
# 所以每一行都要重述它拥有的全部键。

# 交互式 TUI 不需要模块热重载。
# base 的默认是 `!!js "!ctx.get('profileContext')"`——在 profile 启动时
# profileContext 存在，所以 hmr 默认是**开启**的，必须显式关掉。
- id: hmr
  disabled: true

# 表面级人格兜底。挂了预设的会话由 preset 的 persona 行接管；
# 这一行服务于「预设缺失/未挂载」的极端情形。DSH_TUI_PERSONA 可覆盖。
# 键名 personaPrefix/personaSuffix 遵循 dsh-system-prompt 0.2.0-rc.1。
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: !!js process.env.DSH_TUI_PERSONA ?? 'You are a coding agent powered by the {{model}} model.'

# ── agent 能力面移到会话预设之后（与 dsh-web-app 同一结构）────────────────
#
# 下列行的工具/提示词由 presets/*.patch.yml 里的预设声明逐会话挂载。
# 禁用而非删除：base 是共享的，某一行只在表面覆盖层缺席时消失，
# 将来 base 重排组合时它们会静默复活——禁用让这件事可见。
#
# 服务的宿主注册表（terminals/jobs 的 registry、skill registry、goal service、
# token meter、subagent registry 及其 spawn/fork 后端）全部留在 host 层：
# 它们被本文件之外的行读取，或是跨会话单例。预设只拥有面向模型的那部分。

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    # 解析本 TUI 自己的命令行旗标，发布 dshTuiStartup 服务。
    - id: dsh-tui-startup
      name: '@arcaneorion/dsh-tui/startup'

    # 前门本体。
    # 入口级 inject 只用于保证挂载顺序；插件代码级 inject 故意保持最小，
    # 缺服务时应当降级而不是让整棵树死等（"pending (waiting for service)"）。
    - id: dsh-tui
      name: '@arcaneorion/dsh-tui'
      inject: [dshTuiStartup, agents, sessions, agentDefaultModel]

    # 会话预设注册表。预设声明见 presets/*.patch.yml（bundle patch 数组的后续项）。
    # default: standard —— 与官方 web 表面一致。
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # preset 里 tool-subagent 声明 `modelSelectionSettings: true`，
    # 要求 Host 装配这个设置行（官方 web patch 同样持有它）。
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
